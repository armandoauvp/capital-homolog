<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mapa das páginas — AUVP Capital (dev)</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 40px 16px; background: #f5f5f5; color: #222; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p { margin: 0 0 24px; color: #666; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    a { display: flex; justify-content: space-between; gap: 16px; padding: 12px 16px; background: #fff; border-radius: 8px; color: #023619; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    a:hover { background: #e9ba70; }
    code { color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>Páginas migradas de auvpcapital.com.br</h1>
    <p>Índice só de desenvolvimento (pastas com "_" não entram no build).</p>
    <ul id="lista"></ul>
  </main>
  <script>
    const paginas = [
      ['/', 'Home'], ['/wealth/', 'AUVP Wealth'], ['/planos/', 'Planos'], ['/cambio/', 'AUVP Câmbio'],
      ['/cambio-cloned-2040/', 'AUVP Câmbio (variação com mapa)'], ['/credito/', 'AUVP Crédito'], ['/corporate/', 'AUVP Corporate'],
      ['/seguros/', 'AUVP Seguros'], ['/compliance/', 'Compliance'], ['/abertura-conta-pf/', 'Abertura de conta PF'],
      ['/abertura-conta-pj/', 'Abertura de conta PJ'], ['/aupo11-faq/', 'AUPO11 — FAQ'],
      ['/giro-da-bolsa-itinerante/', 'Giro da Bolsa Itinerante'], ['/jantar-com-raul/', 'Jantar com Raul'],
      ['/auvp-escola-nosso-processo/', 'AUVP Escola — Nosso processo (rascunho)'], ['/link-auvp-business-day/', 'AUVP Business Day — links'],
      ['/politica-de-privacidade/', 'Política de privacidade'], ['/termos-de-uso/', 'Termos de uso'],
      ['/elementor-4141/', 'Elementor #4141 (redireciona para /seguros/)'],
    ]
    document.getElementById('lista').innerHTML = paginas
      .map(([href, nome]) => `<li><a href="${href}"><span>${nome}</span><code>${href}</code></a></li>`).join('')
  </script>
</body>
</html>
